<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#00c46a" />
    <meta name="description" content="오늘 아침 수확한 농산물을 생산자와 검수 상태까지 확인하고 사는 ON-FARM" />
    <title>ON-FARM · 오늘 아침 수확</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/img/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/shop.css" />
  </head>
  <body class="shop">
    <a class="skip-link" href="#mainContent">본문으로 바로가기</a>

    <div class="shop-page">
      <header class="shop-top">
        <a class="shop-logo" href="/shop" aria-label="ON-FARM 홈">ON<i>·</i>FARM</a>
        <div class="shop-top-actions">
          <!-- 시연 이동 메뉴가 붙는 자리(발표자용 보조 수단) -->
          <div class="demo-nav-slot" id="demoNavSlot"></div>
          <a class="icon-button" href="/shop/cart" aria-label="장바구니">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 5h2l2 10h10l2-7H7M9 20h.01M17 20h.01" />
            </svg>
            <span class="cart-badge" data-cart-count hidden>0</span>
          </a>
        </div>
      </header>

      <main class="shop-main" id="mainContent">
        <form class="shop-search" id="searchForm" role="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="m16 16 4 4" /></svg>
          <label class="visually-hidden" for="searchInput">농산물·농가 검색</label>
          <input id="searchInput" type="search" placeholder="배, 감자, 농가 이름" autocomplete="off" />
          <button type="submit">찾기</button>
        </form>

        <!-- 산지 추천 배너 4종 캐러셀 — 4초 간격 자동 순환.
             문구는 이미지가 아니라 HTML이며, 링크는 홈의 종류 필터(?category=)로 연결한다.
             자동으로 바뀌는 영역이라 aria-live="off"(스크린리더가 계속 읽지 않게)로 둔다. -->
        <section
          class="promo-carousel"
          id="promoCarousel"
          aria-label="ON-FARM 산지 추천"
          aria-roledescription="carousel"
          aria-live="off"
        >
          <div class="promo-viewport">
            <div class="promo-track" id="promoTrack">
              <div class="promo-slide" role="group" aria-roledescription="슬라이드" aria-label="1 / 4">
                <a class="home-promo home-promo--fruit" href="/shop?category=fruit">
                  <img src="/img/banners/banner-01-seasonal-fruit.webp" alt="" width="1800" height="675" decoding="async" />
                  <span class="home-promo-copy">
                    <small>산지에서 바로</small>
                    <strong>오늘 만나는<br />제철 과일</strong>
                    <span>과일 보러 가기 <b aria-hidden="true">›</b></span>
                  </span>
                </a>
              </div>

              <div class="promo-slide" role="group" aria-roledescription="슬라이드" aria-label="2 / 4">
                <a class="home-promo home-promo--field" href="/shop?category=vegetable">
                  <img src="/img/banners/banner-02-field-harvest.webp" alt="" width="1800" height="675" loading="lazy" decoding="async" />
                  <span class="home-promo-copy">
                    <small>농부가 고른 햇작물</small>
                    <strong>든든한 식탁을<br />산지의 맛으로</strong>
                    <span>햇작물 보러 가기 <b aria-hidden="true">›</b></span>
                  </span>
                </a>
              </div>

              <!-- 쌀·잡곡은 판매 중 물량(햅쌀)이 있어 준비 중 표시를 붙이지 않는다.
                   사진 왼쪽 여백이 크림색이라 글자는 짙은 갈색으로 대비를 잡는다. -->
              <div class="promo-slide" role="group" aria-roledescription="슬라이드" aria-label="3 / 4">
                <a class="home-promo home-promo--grain" href="/shop?category=grain">
                  <img src="/img/banners/banner-04-rice-grains.webp" alt="" width="1800" height="675" loading="lazy" decoding="async" />
                  <span class="home-promo-copy">
                    <small>들녘에서 바로</small>
                    <strong>갓 도정한 쌀과<br />구수한 잡곡</strong>
                    <span>쌀·잡곡 보러 가기 <b aria-hidden="true">›</b></span>
                  </span>
                </a>
              </div>

              <!-- 수산물은 아직 판매 물량이 없어 눌러도 "준비 중" 안내가 뜬다.
                   배너가 지금 살 수 있다고 오해시키지 않도록 문구 옆에 준비 중 표시를 함께 둔다. -->
              <div class="promo-slide" role="group" aria-roledescription="슬라이드" aria-label="4 / 4">
                <a class="home-promo home-promo--abalone" href="/shop?category=seafood">
                  <img src="/img/banners/banner-03-fresh-abalone.webp" alt="" width="1800" height="675" loading="lazy" decoding="async" />
                  <span class="home-promo-copy">
                    <small>바다에서 바로 <em class="home-promo-soon">준비 중</em></small>
                    <strong>싱싱한 전복을<br />우리 집 식탁으로</strong>
                    <span>전복 보러 가기 <b aria-hidden="true">›</b></span>
                  </span>
                </a>
              </div>
            </div>
          </div>

          <div class="promo-dots" id="promoDots" role="group" aria-label="배너 이동"></div>
        </section>

        <!-- 추석 이벤트 보조 배너 — 주 배너(캐러셀)를 압도하지 않게 높이를 67%로 낮췄다.
             사진 위아래를 자르면 보름달·대추가 잘리므로, 자르지 않고 사진을 오른쪽에 붙여 축소해 넣고
             남는 왼쪽은 사진과 같은 남색(#00070f)으로 채운다(이음매가 보이지 않는다).
             기획전 페이지는 없으므로 실제로 있는 필터(과일 종류)로만 연결한다. -->
        <a class="event-promo" href="/shop?category=fruit">
          <img
            src="/img/banners/banner-05-chuseok-event.webp"
            alt=""
            width="1800"
            height="675"
            loading="lazy"
            decoding="async"
          />
          <span class="event-promo-copy">
            <small class="event-promo-tag">한가위</small>
            <strong>차례상에 올릴 것들<br />산지에서 바로</strong>
            <span>추석 과일 보러 가기 <b aria-hidden="true">›</b></span>
          </span>
        </a>

        <!-- 1단 종류 → 2단 품목 → 3단 지역 순서로 좁힌다(상위가 하위를 결정한다). -->
        <!-- data-hscroll: 가로로 넘칠 때 화살표·페이드를 붙여 주는 상자(마우스 전용 환경 대응) -->
        <div class="hscroll" data-hscroll>
          <div class="cat-tabs" id="catTabs" role="group" aria-label="종류 선택"></div>
        </div>
        <div class="hscroll" data-hscroll id="itemStripBox">
          <div class="item-strip" id="itemStrip" role="group" aria-label="품목 선택"></div>
        </div>
        <div class="chip-row" id="regionChips" aria-label="지역 선택"></div>

        <div class="list-head">
          <h2 id="listTitle">오늘 올라온 농산물</h2>
          <span id="listCount" aria-live="polite"></span>
        </div>

        <div class="goods-grid" id="grid"></div>

        <!-- 한 페이지 10개를 넘을 때만 채워진다(그 전에는 비어 있어 보이지 않는다). -->
        <nav class="pager" id="pager" aria-label="상품 목록 페이지"></nav>

        <!-- 품목은 등록돼 있으나 아직 판매 물량이 없는 종류 안내(빈 목록 대신) -->
        <div class="coming-soon" id="comingSoon" hidden>
          <h2 id="comingSoonTitle">준비 중입니다</h2>
          <p id="comingSoonDesc">곧 열립니다.</p>
          <button class="empty-reset" type="button" id="comingSoonBack">농산물 보기</button>
        </div>

        <div class="empty" id="empty" hidden>
          <h2>조건에 맞는 상품이 없습니다.</h2>
          <p>검색어를 줄이거나 필터를 초기화해 다시 확인해 주세요.</p>
          <button class="empty-reset" type="button" id="resetFilters">필터 초기화</button>
        </div>
      </main>

      <nav class="tabbar" aria-label="주요 메뉴">
        <a class="is-current" href="/shop" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-7 9 7" /><path d="M5 10v10h14V10M9 20v-6h6v6" /></svg>
          홈
        </a>
        <button type="button" id="tabSearch">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="m16 16 4 4" /></svg>
          검색
        </button>
        <a href="/shop/cart">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h2l2 10h10l2-7H7M9 20h.01M17 20h.01" /></svg>
          장바구니<span class="tab-count" data-cart-count hidden>0</span>
        </a>
        <a href="/shop/orders">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v18l-2-1.5L13 21l-2-1.5L9 21l-2-1.5L5 21V5a2 2 0 0 1 2-2Z" /><path d="M9 8h6M9 12h6" /></svg>
          주문
        </a>
      </nav>
    </div>

    <script type="module" src="/js/shop.js"></script>
  </body>
</html>
