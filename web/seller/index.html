<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#00c46a" />
    <meta name="description" content="사진 한 장으로 농산물 판매를 시작하는 ON-FARM 판매자 화면" />
    <title>ON-FARM · 판매자</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/img/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/seller.css" />
  </head>
  <body class="seller">
    <a class="skip-link" href="#mainContent">본문으로 바로가기</a>
    <div class="mode-banner" id="modeBanner" hidden></div>

    <main class="s-page" id="mainContent">
      <header class="s-head">
        <span class="who" id="whoName">불러오는 중</span>
        <div class="s-head-actions">
          <!-- 시연 이동 메뉴가 붙는 자리(발표자용 보조 수단 — 어르신 주 동선보다 작게 둔다) -->
          <span class="demo-nav-slot" id="demoNavSlot"></span>
          <!-- 안내 토글은 밀도보다 상위 개념이라 왼쪽에 둔다.
               밀도 토글은 '다음 행동'이라 aria-pressed 지만, 안내는 켬/끔 상태 자체가 정보라 role="switch". -->
          <button class="s-chip guide-toggle" id="guideBtn" type="button" role="switch" aria-checked="true">
            <span class="sw" aria-hidden="true"></span><span class="tx">안내 켜짐</span>
          </button>
          <button class="s-chip density-toggle" id="densityBtn" type="button">가⁻</button>
          <button class="s-chip" id="swapBtn" type="button" aria-expanded="false" aria-controls="swapList">농가 바꾸기</button>
        </div>
      </header>

      <div class="s-body">
        <p class="visually-hidden" id="guideLive" aria-live="polite"></p>
        <!-- 졸업 안내 줄이 붙는 자리(등록 3회 뒤 1회만) -->
        <span id="guideGraduateSlot"></span>

        <!-- 안내 헤드라인 — 카드로 만들지 않는다. 카드가 늘면 진짜 눌러야 할 카드가 묻힌다. -->
        <div class="guide-lead" id="guideLead">
          <strong>처음부터 따라 하기</strong>
          <span>지금 해야 할 곳만 크게 보여 드립니다</span>
        </div>

        <!-- 화면 절반을 차지하는 대형 사진 버튼 — 접속하면 이미 등록 1단계다. -->
        <button class="shoot" id="shootBtn" type="button">
          <span class="now-badge">지금 할 일</span>
          <span class="lens" aria-hidden="true">
            <svg viewBox="0 0 64 64">
              <path d="M20 19.5 24 13h16l4 6.5h7A5.5 5.5 0 0 1 56.5 25v22a5.5 5.5 0 0 1-5.5 5.5H13A5.5 5.5 0 0 1 7.5 47V25a5.5 5.5 0 0 1 5.5-5.5h7Z" />
              <circle cx="32" cy="35.5" r="10.5" />
            </svg>
          </span>
          <span class="big">사진 찍기</span>
          <span class="sub">찍으면 나머지는 저희가 합니다</span>
          <!-- 3단계 인디케이터는 버튼 '안'에 둔다. 밖에 두면 이것도 눌러야 하나로 읽힌다.
               같은 정보를 배지·안내문이 이미 음성으로 전달하므로 스크린리더에선 감춘다. -->
          <span class="guide-steps" id="homeSteps" aria-hidden="true"></span>
        </button>

        <p class="guide-hint" id="guideHint">위의 큰 버튼을 눌러 판매 등록을 시작하세요</p>

        <p class="mic" id="micLine"><span class="dot" aria-hidden="true"></span><span id="micText">음성 안내 준비 중</span></p>

        <!-- 큰 항목 3개 — 주문·상품·정산이 각각 제 화면으로 갈라진다.
             건수·금액을 항목 안에 함께 둬서 눌러보지 않아도 오늘 상태를 알 수 있다. -->
        <nav class="s-menu" aria-label="판매자 메뉴">
          <a class="s-menu-item" href="/seller/orders">
            <span class="ic" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5v-9Z" /><path d="m3 7.5 9 4.5 9-4.5M12 12v9" /></svg>
            </span>
            <span class="tx">
              <span class="nm">보낼 주문</span>
              <span class="vl" id="mOrders">세는 중</span>
            </span>
            <span class="count-badge" id="orderBadge" hidden>0</span>
            <span class="go" aria-hidden="true">›</span>
          </a>

          <a class="s-menu-item" href="/seller/products">
            <span class="ic" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" /></svg>
            </span>
            <span class="tx">
              <span class="nm">판매 중 상품</span>
              <span class="vl" id="mProducts">세는 중</span>
            </span>
            <span class="go" aria-hidden="true">›</span>
          </a>

          <a class="s-menu-item" href="/seller/money">
            <span class="ic" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M6 6h12a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3Z" /><path d="M8 10.5 10 15l2-4.5 2 4.5 2-4.5M8.5 13h7" /></svg>
            </span>
            <span class="tx">
              <span class="nm">받을 돈</span>
              <span class="vl" id="mMoney">세는 중</span>
            </span>
            <span class="go" aria-hidden="true">›</span>
          </a>
        </nav>

        <!-- 농가 바꾸기 — 농민 계정만 큰 카드로 보여준다.
             한 번 열면 닫을 수 없어 "오늘 할 일"과 뒤섞여 보이던 문제가 있어,
             테두리로 묶고 제목·닫기 버튼을 둬서 목록의 시작과 끝이 분명하게 했다. -->
        <section class="swap-list" id="swapList" hidden aria-labelledby="swapTitle">
          <div class="swap-head">
            <h2 id="swapTitle">농가 바꾸기</h2>
            <button class="swap-close" id="swapCloseBtn" type="button">닫기</button>
          </div>
          <div class="swap-cands" id="swapCands"></div>
          <p class="swap-foot">바꿀 농가를 고르면 그 농가로 다시 로그인합니다.</p>
        </section>

        <p class="demo-note">시연용 계정으로 자동 로그인되어 있습니다.</p>
      </div>
    </main>

    <script type="module">
      import { api, requireRole, money, el, $, startAutoRefresh, toast, mountModeBanner } from '/js/api.js';
      import { speak, canSpeak } from '/js/speak.js';
      import { mountDensityToggle } from '/js/seller-density.js';
      import { mountDemoNav } from '/js/demo-nav.js';
      import {
        consumeGraduationNotice,
        mountGuideToggle,
        renderGuideSteps,
        setGuideDemoMode,
      } from '/js/seller-guide.js';

      mountDensityToggle('#densityBtn');
      mountDemoNav('#demoNavSlot');
      mountGuideToggle('#guideBtn', '#guideLive');
      // 홈에서는 언제나 ①(사진)이 현재 단계다 — 아직 등록 전이다.
      renderGuideSteps('#homeSteps', 0);

      // 졸업 안내는 딱 한 번만 보여주고 다음 진입에서 자동으로 사라진다.
      if (consumeGraduationNotice()) {
        const line = el('p', {
          class: 'guide-graduate',
          text: '이제 익숙해지셨네요. 안내를 껐습니다. 다시 보시려면 오른쪽 위 안내를 눌러 주세요.',
        });
        $('#guideGraduateSlot').replaceWith(line);
      }

      void mountModeBanner('#modeBanner').then((cfg) => setGuideDemoMode(cfg?.ai?.demoMode));

      $('#micText').textContent = canSpeak()
        ? '“사진 찍어 주세요” 음성 안내 켜짐'
        : '이 기기에서는 음성 안내를 쓸 수 없습니다';

      const session = await requireRole('farmer');
      if (session) {
        $('#whoName').textContent = `${session.user.name}님`;
      }

      /** 0 이어도 흐리게 표시할 뿐 감추지 않는다 — "없다"는 것도 알아야 할 사실이다. */
      function setCount(id, text, zero) {
        const node = $(id);
        node.textContent = text;
        node.classList.toggle('is-zero', zero);
      }

      let summarySignature = '';
      async function loadSummary() {
        const [orders, listings, settle] = await Promise.all([
          api('/api/farmer/orders'),
          api('/api/farmer/listings'),
          api('/api/farmer/settlements'),
        ]);
        const pending = orders.orders.filter(
          (order) => order.fulfillment_status === 'farmer_preparing' && !order.has_rejection,
        );
        const active = listings.listings.filter((listing) => listing.status === 'active');
        const signature = `${pending.length}:${active.length}:${settle.summary.pendingNet}`;
        if (signature === summarySignature) return;
        summarySignature = signature;

        const badge = $('#orderBadge');
        badge.hidden = pending.length === 0;
        badge.textContent = String(pending.length);
        // 보낼 주문이 있으면 안내 모드여도 메뉴를 흐리지 않는다 — 안내보다 실제 주문이 우선.
        document.querySelector('.s-menu').classList.toggle('has-urgent', pending.length > 0);

        setCount('#mOrders', `${pending.length}건`, pending.length === 0);
        setCount('#mProducts', `${active.length}개`, active.length === 0);
        setCount('#mMoney', money(settle.summary.pendingNet), settle.summary.pendingNet === 0);
      }

      if (session) {
        const refresh = startAutoRefresh(loadSummary);
        await refresh();
      }

      $('#shootBtn').addEventListener('click', () => {
        speak('사진을 찍어 주세요.');
        location.href = '/seller/sell';
      });

      // 농가 바꾸기 — 농민 계정만 추려 큰 카드로 보여준다(계정 아홉 개 목록이라는 벽을 만들지 않는다).
      // 닫는 방법은 세 가지다: 같은 버튼 다시 누르기 · 패널 안 닫기 버튼 · Esc.
      let swapLoaded = false;

      function setSwapOpen(open) {
        $('#swapList').hidden = !open;
        $('#swapBtn').setAttribute('aria-expanded', String(open));
      }

      function closeSwap() {
        setSwapOpen(false);
        $('#swapBtn').focus();
      }

      $('#swapCloseBtn').addEventListener('click', closeSwap);
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !$('#swapList').hidden) closeSwap();
      });

      $('#swapBtn').addEventListener('click', async () => {
        const box = $('#swapList');
        if (!box.hidden) {
          setSwapOpen(false);
          return;
        }
        setSwapOpen(true);
        if (swapLoaded) return;
        try {
          const { accounts } = await api('/api/accounts');
          const list = $('#swapCands');
          list.replaceChildren();
          for (const account of accounts.filter((a) => a.role === 'farmer')) {
            list.append(
              el('button', {
                class: 'cand',
                type: 'button',
                onclick: async () => {
                  await api('/api/auth/login', { body: { userId: account.id } });
                  location.reload();
                },
              }, [
                el('span', {}, [
                  el('span', { class: 'nm', text: `${account.name}님` }),
                  el('span', { class: 'cf', text: `${account.farmName ?? ''} ${account.region ?? ''}`.trim() }),
                ]),
              ]),
            );
          }
          swapLoaded = true;
        } catch (error) {
          toast(error.message ?? '농가 목록을 불러오지 못했습니다.');
        }
      });
    </script>
  </body>
</html>
