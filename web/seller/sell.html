<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#00c46a" />
    <meta name="description" content="사진을 찍고 품목과 수량만 확인하는 ON-FARM 농산물 판매 등록" />
    <title>ON-FARM · 사진으로 판매 등록</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/img/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/seller.css" />
  </head>
  <body class="seller">
    <a class="skip-link" href="#mainContent">본문으로 바로가기</a>
    <div class="mode-banner" id="modeBanner" hidden></div>

    <main class="s-page" id="mainContent">
      <header class="s-head">
        <button class="s-chip" id="backBtn" type="button">← 뒤로</button>
        <div class="s-head-actions">
          <!-- 시연 이동 메뉴가 붙는 자리(발표자용 보조 수단) -->
          <span class="demo-nav-slot" id="demoNavSlot"></span>
          <button class="s-chip density-toggle" id="densityBtn" type="button">가⁻</button>
        </div>
      </header>

      <!-- 진행 표시는 실제 단계(사진·품목·수량) 3개와 맞춘다. -->
      <div
        class="prog"
        id="sellProgress"
        role="progressbar"
        aria-label="판매 등록 진행 단계"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="33"
      >
        <div class="pt">
          <span><b id="progressStep">1 / 3</b> <span id="progressLabel">사진 찍기</span></span>
          <span id="progressHint">곧 끝납니다</span>
        </div>
        <div class="pb" aria-hidden="true"><i id="progressFill" style="width: 33%"></i></div>
      </div>

      <!-- ① 사진 -->
      <section class="sell-step" id="stepPhoto">
        <div>
          <h1 class="ask">수확한 것을 찍어 주세요</h1>
          <!--
            "꽉 차게" 는 예의상 하는 말이 아니라 측정에서 나온 조건이다.
            농산물이 화면을 꽉 채우면 5품목 전부 100% 로 맞히지만,
            화면의 4분의 1만 차지하면 감자는 후보 3개 안에도 들어오지 못했다.
          -->
          <p class="ask-sub">농산물을 화면에 <b>꽉 차게</b>, 가운데 두고 찍어 주세요.</p>
        </div>

        <label class="photo-drop" for="photoInput">
          <span class="lens" aria-hidden="true">
            <svg viewBox="0 0 64 64">
              <path d="M20 19.5 24 13h16l4 6.5h7A5.5 5.5 0 0 1 56.5 25v22a5.5 5.5 0 0 1-5.5 5.5H13A5.5 5.5 0 0 1 7.5 47V25a5.5 5.5 0 0 1 5.5-5.5h7Z" />
              <circle cx="32" cy="35.5" r="10.5" />
            </svg>
          </span>
          <strong>사진 찍기 또는 고르기</strong>
          <span>상자·망·봉이 화면에 꽉 차게 찍어 주세요</span>
        </label>
        <input type="file" id="photoInput" accept="image/*" capture="environment" class="visually-hidden" />

        <div class="s-foot">
          <button class="btn ghost" id="sampleBtn" type="button">사진 없이 시연해 보기</button>
        </div>
      </section>

      <!-- ② 분석 중 -->
      <section class="sell-step" id="stepLoading" hidden>
        <div class="loading-box" aria-live="polite" aria-busy="true">
          <div class="spinner" role="img" aria-label="사진 분석 중"></div>
          <h1 class="ask">사진을 살펴보고 있어요</h1>
          <p class="ask-sub">농산물 종류와 판매 단위를 확인하고 있습니다.</p>
          <img id="loadingPreview" class="photo-preview" alt="분석 중인 농산물 사진" hidden />
        </div>
      </section>

      <!-- ③ 품목 고르기 (후보가 1개여도 반드시 고르게 한다 — 오등록 방지) -->
      <section class="sell-step" id="stepResult" hidden>
        <div>
          <h1 class="ask">어느 것인가요?</h1>
          <p class="ask-sub" id="resultSub"></p>
        </div>

        <div class="cands" id="candidateGrid"></div>

        <div class="badge-row">
          <span class="badge badge-ai" id="badgeSource">AI 확인</span>
          <span class="badge badge-hint" id="badgeQuality">AI 품질 참고</span>
          <span class="badge badge-muted" id="badgeConfidence"></span>
        </div>
        <p class="price-note" id="resultBasis"></p>

        <div class="s-foot">
          <div class="assist-row">
            <button class="assist" id="speakResult" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10H4Z" /><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" /></svg>
              다시 들려주세요
            </button>
          </div>
          <button class="btn ghost" id="resultNo" type="button">여기 없어요 · 직접 고르기</button>
          <button class="btn ghost" id="resultRetake" type="button">사진 다시 찍기</button>
        </div>
      </section>

      <!-- ③-C 전체 품목 직접 선택 -->
      <section class="sell-step" id="stepManual" hidden>
        <div>
          <h1 class="ask">무엇을 파실까요?</h1>
          <p class="ask-sub">농산물 이름을 눌러 주세요.</p>
        </div>
        <div class="manual-grid" id="manualGrid"></div>
        <div class="s-foot">
          <button class="btn ghost" id="manualRetake" type="button">사진 다시 찍기</button>
        </div>
      </section>

      <!-- ④ 수량 + 최종 확인 (한 화면) -->
      <section class="sell-step" id="stepSku" hidden>
        <div class="qty-wrap">
          <div class="qty-card">
            <p class="lbl" id="skuFarm"></p>
            <p class="val" id="skuLine">-</p>
          </div>

          <div class="sku-row" id="skuOptions"></div>

          <div class="stepper">
            <button id="qtyMinus" type="button" aria-label="수량 줄이기">−</button>
            <div class="num" aria-live="polite">
              <span id="qtyValue">5</span>
              <small id="qtyUnitWord">상자</small>
            </div>
            <button id="qtyPlus" type="button" aria-label="수량 늘리기">+</button>
          </div>

          <div class="boxes" id="quantityPack" role="img" aria-label="선택한 수량: 5상자"></div>

          <div class="assist-row">
            <button class="assist" id="speakSku" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10H4Z" /><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" /></svg>
              다시 들려주세요
            </button>
            <button class="assist" id="voiceQty" type="button" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6" /></svg>
              <span id="voiceQtyLabel">“세 상자”라고 말해도 됩니다</span>
            </button>
          </div>

          <div class="sum"><span class="k">받을 돈</span><span class="v" id="sumTotal">-</span></div>
          <p class="price-note">운영자가 미리 정한 표준 가격입니다. AI가 가격을 정하지 않습니다.</p>
        </div>

        <div class="s-foot">
          <button class="btn" id="submitBtn" type="button">이대로 팔기</button>
        </div>
      </section>

      <!-- ⑤ 완료 -->
      <section class="sell-step" id="stepDone" hidden>
        <div class="done">
          <div class="tick" role="img" aria-label="판매 등록 완료">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 12.5 5.5 5.5L20 6" /></svg>
          </div>
          <h1>다 됐습니다</h1>
          <p id="doneSummary"></p>
          <div class="sum"><span class="k">팔리면 받을 돈</span><span class="v" id="doneTotal">-</span></div>
        </div>

        <div class="s-foot">
          <button class="btn" id="doneAgain" type="button">하나 더 올리기</button>
          <button class="btn ghost" id="doneStop" type="button">그만하기</button>
        </div>
      </section>
    </main>

    <script type="module" src="/js/seller-sell.js"></script>
  </body>
</html>
