<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#00c46a" />
    <meta name="description" content="ON-FARM의 판매자 등록부터 소비자 주문, 거점 검수까지 세 화면을 한자리에서 시연합니다." />
    <title>ON-FARM · 서비스 시연</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/img/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/entry.css" />
  </head>
  <body class="entry">
    <a class="skip-link" href="#mainContent">본문으로 바로가기</a>

    <div class="entry-page">
      <div class="mode-banner" id="modeBanner" hidden></div>

      <header class="entry-top">
        <a class="entry-logo" href="/demo" aria-label="ON-FARM 시연 홈">ON<i>·</i>FARM</a>
        <a class="entry-top-link" href="/login">계정 목록</a>
      </header>

      <main class="entry-main" id="mainContent">
        <section class="entry-hero">
          <span class="entry-eyebrow">서비스 시연 시작점</span>
          <h1>세 화면이 하나의 데이터로 이어집니다.</h1>
          <p class="lead">판매자가 사진으로 올리면 소비자 매장에 뜨고, 거점이 실물을 확인해 정산까지 갑니다. 아래에서 볼 화면을 고르세요.</p>
        </section>

        <!-- 심사 시연의 시작점 — 세 화면으로 가는 큰 버튼이 한눈에 보이게 둔다. -->
        <div class="role-cards" role="group" aria-label="역할 전환">
          <button class="role-card" type="button" data-role="seller" id="asSeller">
            <span class="role-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 17c5-1 8-4 9-9 4 2 6 5 6 9-4 3-9 3-15 0Z" /><path d="M7 17c2-3 5-5 9-6" /></svg>
            </span>
            <span class="role-copy">
              <span class="role-step">01 · 판매자</span>
              <strong>사진 찍어 올리기</strong>
              <span class="role-desc">로그인 없이 바로 사진 버튼 <code>/seller</code></span>
            </span>
            <span class="role-go" aria-hidden="true">›</span>
          </button>

          <button class="role-card" type="button" data-role="shop" id="asConsumer">
            <span class="role-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M3 5h2l2 10h10l2-7H7M9 20h.01M17 20h.01" /></svg>
            </span>
            <span class="role-copy">
              <span class="role-step">02 · 소비자</span>
              <strong>보고 주문하기</strong>
              <span class="role-desc">방금 올린 상품이 매장에 <code>/shop</code></span>
            </span>
            <span class="role-go" aria-hidden="true">›</span>
          </button>

          <button class="role-card" type="button" data-role="hub" id="asHub">
            <span class="role-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 21V8l8-5 8 5v13M8 21v-6h8v6M8 10h.01M12 10h.01M16 10h.01" /></svg>
            </span>
            <span class="role-copy">
              <span class="role-step">03 · 지역 거점</span>
              <strong>실물 검수하기</strong>
              <span class="role-desc">확정 등급·배송 상태 기록 <code>/hub</code></span>
            </span>
            <span class="role-go" aria-hidden="true">›</span>
          </button>
        </div>

        <h2 class="entry-section-title">시연 준비</h2>
        <section class="entry-card" aria-labelledby="resetTitle">
          <h2 id="resetTitle">처음 상태로 되돌리기</h2>
          <p class="note">발표 직전 상품과 주문 데이터를 초기 상태로 되돌립니다. 장바구니도 함께 비웁니다.</p>
          <button class="entry-btn danger" id="resetBtn" type="button">데모 데이터 초기화</button>
        </section>

        <h2 class="entry-section-title">현재 서버 상태</h2>
        <section class="entry-card" aria-labelledby="aiTitle">
          <h2 id="aiTitle">AI 동작 방식</h2>
          <div class="state-row"><span class="k">판정 제공자</span><span class="v" id="cfgProvider">-</span></div>
          <div class="state-row"><span class="k">이미지 외부 전송</span><span class="v" id="cfgOffline">-</span></div>
          <div class="state-row"><span class="k">고정 응답 모드</span><span class="v" id="cfgDemo">-</span></div>
          <p class="note">외부 API가 없으면 로컬 색·질감 규칙으로 판정하며, 화면에서도 이 상태를 숨기지 않습니다.</p>
        </section>
      </main>
    </div>

    <script type="module">
      import { $, api, mountModeBanner, toast } from '/js/api.js';

      await mountModeBanner('#modeBanner');

      // 다른 화면의 시연 메뉴에서 초기화하면 세션이 사라져 이곳으로 돌아온다.
      // 무슨 일이 있었는지 도착한 화면에서도 한 번 더 말해준다.
      if (new URLSearchParams(location.search).get('reset') === '1') {
        toast('데이터를 초기 상태로 되돌렸습니다. 역할을 다시 골라 주세요.');
      }
      const config = await api('/api/config');
      $('#cfgProvider').textContent = config.ai.provider;
      $('#cfgOffline').textContent = config.ai.offline ? '없음 · 로컬 판정' : '있음 · 외부 API';
      $('#cfgDemo').textContent = config.ai.demoMode ? '켜짐 · 고정 응답' : '꺼짐';

      const { accounts } = await api('/api/accounts');
      const pick = (role, name) =>
        accounts.find((account) => account.role === role && (!name || account.name === name)) ??
        accounts.find((account) => account.role === role);

      // 역할 전환은 '그 역할 계정으로 로그인 + 새 주소로 이동' 한 동작이다.
      async function loginAs(account, to) {
        if (!account) {
          toast('계정을 찾지 못했습니다. 데모 데이터를 초기화해 주세요.');
          return;
        }
        await api('/api/auth/login', { body: { userId: account.id } });
        location.href = to;
      }

      $('#asSeller').addEventListener('click', () => loginAs(pick('farmer', '김복순'), '/seller'));
      $('#asConsumer').addEventListener('click', () => loginAs(pick('consumer', '장바구니'), '/shop'));
      $('#asHub').addEventListener('click', () => loginAs(pick('hub_operator'), '/hub'));

      $('#resetBtn').addEventListener('click', async () => {
        if (!confirm('현재 등록된 상품과 주문을 모두 지우고 초기 상태로 되돌립니다. 계속할까요?')) return;
        try {
          await api('/api/demo/reset', { body: { confirm: 'RESET' } });
          localStorage.removeItem('onfarm.cart.v1');
          toast('초기 상태로 되돌렸습니다.');
        } catch (error) {
          toast(error.message);
        }
      });
    </script>
  </body>
</html>
