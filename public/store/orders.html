<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#00754a" />
    <meta name="description" content="ON-FARM 주문 상품의 거점 검수와 배송 진행 상태를 확인하세요." />
    <title>ON-FARM · 주문 내역</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/img/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/store.css" />
  </head>
  <body class="store store-consumer">
    <a class="skip-link" href="#mainContent">본문으로 바로가기</a>

    <header class="store-top">
      <div class="row">
        <a class="logo" href="/" aria-label="ON-FARM 산지 직송 매장 홈">
          <img src="/img/icon.svg" alt="" aria-hidden="true" />
          <span class="logo-copy"><strong>ON-FARM</strong><small>주문 내역</small></span>
        </a>
        <nav class="top-actions" aria-label="주요 메뉴">
          <a class="nav-link" href="/" aria-label="매장 홈">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-7 9 7" /><path d="M5 10v10h14V10M9 20v-6h6v6" /></svg>
            <span class="nav-label">홈</span>
          </a>
          <a class="nav-link current" href="/store/orders" aria-current="page" aria-label="주문 내역">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v18l-2-1.5L13 21l-2-1.5L9 21l-2-1.5L5 21V5a2 2 0 0 1 2-2Z" /><path d="M9 8h6M9 12h6" /></svg>
            <span class="nav-label">주문 내역</span>
          </a>
          <a class="nav-link" href="/store/cart" aria-label="장바구니">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h2l2 10h10l2-7H7M9 20h.01M17 20h.01" /></svg>
            <span class="nav-label">장바구니</span>
          </a>
          <a class="nav-link role-switch" href="/farmer" aria-label="농가 작업장">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17c5-1 8-4 9-9 4 2 6 5 6 9-4 3-9 3-15 0Z" /><path d="M7 17c2-3 5-5 9-6" /></svg>
            <span class="nav-label">농가</span>
          </a>
        </nav>
      </div>
    </header>

    <main class="store-main narrow" id="mainContent">
      <div class="page-heading">
        <div>
          <p class="eyebrow">구매 기록</p>
          <h1>주문 진행을 확인하세요.</h1>
          <p class="lead">거점의 실물 확인부터 배송 완료까지 상품별 상태를 보여드립니다.</p>
        </div>
        <span class="page-count" id="hint"></span>
      </div>
      <section class="orders-list" id="list" aria-label="주문 목록"></section>
    </main>

    <script type="module">
      import { $, api, el, money, me, inspectionLabel } from '/js/api.js';

      const justOrdered = new URLSearchParams(location.search).get('new');
      const session = await me();
      if (!session || session.user.role !== 'consumer') {
        location.href = '/login?role=consumer&next=/store/orders';
      }

      const { orders } = await api('/api/store/orders');
      const box = $('#list');
      box.replaceChildren();
      $('#hint').textContent = `${orders.length}건`;

      if (!orders.length) {
        box.append(
          el('div', { class: 'empty-state' }, [
            el('div', { class: 'empty-state-inner' }, [
              el('span', { class: 'empty-state-icon', 'aria-hidden': 'true', html: '<svg class="ui-icon" viewBox="0 0 24 24"><path d="M7 3h10v18l-2-1.5L13 21l-2-1.5L9 21l-2-1.5L5 21V5a2 2 0 0 1 2-2Z" /><path d="M9 8h6M9 12h6" /></svg>' }),
              el('h2', { text: '아직 주문 내역이 없습니다.' }),
              el('p', { text: '산지에서 오늘 올라온 상품을 둘러보세요.' }),
              el('a', { class: 'btn', href: '/', text: '상품 둘러보기' }),
            ]),
          ]),
        );
      }

      for (const order of orders) {
        const isNew = justOrdered && order.order_no === justOrdered;
        const lines = order.items.map((item) =>
          el('div', { class: 'order-line' }, [
            el('div', {}, [
              el('div', { class: 'order-line-title', text: `${item.title} × ${item.quantity}` }),
              el('div', { class: 'order-line-status', text: inspectionLabel(item.inspection_status) }),
            ]),
            el('div', { class: 'order-line-price', text: money(item.amount) }),
          ]),
        );

        box.append(
          el('article', { class: `order-card${isNew ? ' is-new' : ''}` }, [
            el('header', { class: 'order-card-head' }, [
              el('div', {}, [
                el('div', { class: 'order-number', text: order.order_no }),
                el('div', { class: 'order-date', text: order.created_at }),
              ]),
              el('span', { class: `badge ${isNew ? 'badge-ai' : 'badge-muted'}`, text: isNew ? '방금 접수' : '결제 완료' }),
            ]),
            el('div', { class: 'order-lines' }, lines),
            el('footer', { class: 'order-total' }, [
              el('span', { text: '주문 합계' }),
              el('strong', { text: money(order.total_amount) }),
            ]),
          ]),
        );
      }
    </script>
  </body>
</html>
