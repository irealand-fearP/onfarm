<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#00754a" />
    <meta name="description" content="ON-FARM 농산물 주문 수량과 거점 진행 상태 확인" />
    <title>ON-FARM · 주문 확인</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/img/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/farmer.css" />
  </head>
  <body class="farmer">
    <a class="skip-link" href="#mainContent">본문으로 바로가기</a>
    <header class="farmer-top subpage-top">
      <a class="back-link" href="/farmer">
        <svg class="ui-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m14 5-7 7 7 7" />
        </svg>
        <span>홈</span>
      </a>
      <div class="page-context">
        <strong>주문 확인</strong>
        <small>준비할 상품과 수량</small>
      </div>
    </header>

    <main class="farmer-main management-main" id="mainContent">
      <section class="page-intro" aria-labelledby="pageTitle">
        <p class="eyebrow">주문 관리</p>
        <h1 id="pageTitle">준비할 주문을 확인하세요.</h1>
        <p class="lead" id="orderSummary">주문을 불러오고 있습니다.</p>
      </section>

      <div class="item-list" id="list" aria-live="polite">
        <div class="loading-state"><span></span><p>주문을 불러오는 중입니다</p></div>
      </div>

      <aside class="info-panel">
        <svg class="ui-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 11v6M12 7.5h.01" />
        </svg>
        <div>
          <strong>포장과 배송은 거점이 돕습니다.</strong>
          <p>주문 상품을 준비해 지역 거점에 가져다 놓으시면 됩니다.</p>
        </div>
      </aside>
    </main>

    <nav class="farmer-bottom-nav" aria-label="농가 주요 메뉴">
      <a href="/farmer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-7 9 7"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg><span>홈</span></a>
      <a href="/farmer/sell"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h3l2-2h4l2 2h3a2 2 0 0 1 2 2v9H3V9a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="3"/></svg><span>등록</span></a>
      <a href="/farmer/listings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><path d="M7 4v4M12 10v4M17 16v4"/></svg><span>판매</span></a>
      <a class="current" href="/farmer/orders" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v18l-2-1.5L13 21l-2-1.5L9 21l-2-1.5L5 21V5a2 2 0 0 1 2-2Z"/><path d="M9 8h6M9 12h6"/></svg><span>주문</span></a>
      <a href="/farmer/settlement"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M7.5 8.5 9.5 16l2.5-5 2.5 5 2-7.5"/></svg><span>정산</span></a>
    </nav>

    <script type="module">
      import { api, requireRole, money, el, $, inspectionLabel } from '/js/api.js';
      import { speak } from '/js/speak.js';

      await requireRole('farmer');
      const { orders } = await api('/api/farmer/orders');
      const pendingOrders = orders.filter((order) => order.inspection_status === 'hub_pending');
      const box = $('#list');
      box.replaceChildren();

      if (pendingOrders.length > 0) {
        $('#orderSummary').textContent = `전체 ${orders.length}건 중 지금 확인할 주문이 ${pendingOrders.length}건 있습니다.`;
        speak(`확인할 주문이 ${pendingOrders.length}건 있습니다.`);
      } else if (orders.length > 0) {
        $('#orderSummary').textContent = `전체 주문 ${orders.length}건이 모두 다음 단계로 넘어갔습니다.`;
      } else {
        $('#orderSummary').textContent = '아직 들어온 주문이 없습니다.';
      }

      if (!orders.length) {
        box.append(
          el('section', { class: 'empty-state' }, [
            el('div', {
              class: 'empty-icon',
              html: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h10v18l-2-1.5L13 21l-2-1.5L9 21l-2-1.5L5 21V5a2 2 0 0 1 2-2Z"/><path d="M9 8h6M9 12h6"/></svg>',
            }),
            el('h2', { text: '아직 주문이 없습니다.' }),
            el('p', { text: '주문이 들어오면 이 화면과 음성으로 알려드립니다.' }),
          ]),
        );
      }

      for (const order of orders) {
        const needsAttention = order.inspection_status === 'hub_pending';
        box.append(
          el('article', { class: `order-item${needsAttention ? ' needs-attention' : ''}` }, [
            el('header', { class: 'order-head' }, [
              el('div', {}, [
                el('p', { class: 'order-number', text: `주문 ${order.order_no}` }),
                el('h2', { text: order.title }),
              ]),
              el('span', {
                class: needsAttention ? 'badge badge-hint' : 'badge badge-hub',
                text: needsAttention ? '확인 필요' : inspectionLabel(order.inspection_status),
              }),
            ]),
            el('p', { class: 'order-amount', text: money(order.amount) }),
            el('dl', { class: 'order-details' }, [
              el('div', { class: 'kv' }, [
                el('dt', { class: 'k', text: '준비할 수량' }),
                el('dd', { class: 'v', text: `${order.quantity} × ${order.sku_label}` }),
              ]),
              el('div', { class: 'kv' }, [
                el('dt', { class: 'k', text: '지금 상태' }),
                el('dd', { class: 'v', text: inspectionLabel(order.inspection_status) }),
              ]),
            ]),
            needsAttention
              ? el('p', { class: 'order-action', text: '상품을 준비해 지역 거점에 가져다 놓아 주세요.' })
              : null,
          ]),
        );
      }
    </script>
  </body>
</html>
