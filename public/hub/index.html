<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ON-FARM · 거점/관리자</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/img/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/store.css" />
  </head>
  <body class="store">
    <header class="store-top">
      <div class="row">
        <a class="logo" href="/"><span class="dot"></span>ON-FARM 거점</a>
        <div class="top-actions">
          <span class="chip-link" id="who">-</span>
          <a class="chip-link" href="/login">계정 바꾸기</a>
        </div>
      </div>
    </header>

    <main class="store-main wrap-wide">
      <div class="section-title">
        <h2>지역 집하·검수 거점</h2>
        <span>농가는 상품을 갖다 놓기만, 검수·물류·정산은 거점이</span>
      </div>

      <div class="stat-row" id="stats"></div>

      <div class="section-title"><h2>상품 처리 현황</h2><span id="count"></span></div>
      <div class="table-wrap">
        <table class="data">
          <thead>
            <tr>
              <th>상품</th>
              <th>농가</th>
              <th>AI 참고 판정</th>
              <th>수량</th>
              <th>진행 상태</th>
              <th>처리</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <p style="font-size: 13px; color: var(--muted); margin-top: 14px">
        AI 참고 판정과 실물 검수 결과는 별도로 기록됩니다. 소비자에게 표시되는 확정 등급은 실물 검수 결과입니다.
      </p>
    </main>

    <script type="module">
      import { $, api, el, money, toast, inspectionLabel } from '/js/api.js';

      let session = null;
      try {
        session = await api('/api/me');
      } catch {
        location.href = '/login?role=hub_operator&next=/hub';
      }
      if (session && session.user.role !== 'hub_operator' && session.user.role !== 'admin') {
        location.href = '/login?role=hub_operator&next=/hub';
      }
      $('#who').textContent = session ? session.user.name : '';

      const STAT_LABELS = [
        ['incoming', '입고 예정'],
        ['needInspection', '검수 필요'],
        ['readyToShip', '배송 예정'],
        ['delivered', '배송 완료'],
        ['soldOut', '판매 완료'],
      ];

      async function load() {
        const data = await api('/api/hub/dashboard');
        const stats = $('#stats');
        stats.replaceChildren();
        for (const [key, label] of STAT_LABELS) {
          stats.append(
            el('div', { class: 'stat' }, [
              el('div', { class: 'label', text: label }),
              el('div', { class: 'value', text: String(data.counters[key] ?? 0) }),
            ]),
          );
        }

        $('#count').textContent = `${data.listings.length}건`;
        const rows = $('#rows');
        rows.replaceChildren();

        for (const l of data.listings) {
          const actions = el('div', { class: 'inline-actions' });
          if (l.inspection_status === 'ai_checked' || l.inspection_status === 'hub_pending') {
            actions.append(
              el('button', { class: 'go', type: 'button', text: '검수 통과', onclick: () => inspect(l.id, 'pass', l.quality_hint) }),
              el('button', { type: 'button', text: '등급 조정', onclick: () => downgrade(l.id) }),
              el('button', { class: 'warn', type: 'button', text: '반려', onclick: () => inspect(l.id, 'reject', null) }),
            );
          } else if (l.inspection_status === 'hub_passed') {
            actions.append(el('button', { class: 'go', type: 'button', text: '배송 준비', onclick: () => setStatus(l.id, 'ready_to_ship') }));
          } else if (l.inspection_status === 'ready_to_ship') {
            actions.append(el('button', { class: 'go', type: 'button', text: '배송 완료', onclick: () => setStatus(l.id, 'delivered') }));
          } else {
            actions.append(el('span', { style: 'font-size:13px;color:var(--muted)', text: '처리 완료' }));
          }

          rows.append(
            el('tr', {}, [
              el('td', {}, [
                el('div', { style: 'font-weight:700', text: l.title }),
                el('div', { style: 'font-size:12px;color:var(--muted)', text: `${l.sku_label} · ${money(l.unit_price)}` }),
              ]),
              el('td', {}, [
                el('div', { text: l.farm_name }),
                el('div', { style: 'font-size:12px;color:var(--muted)', text: `${l.region_sigungu} · ${l.hub_name ?? '거점 미지정'}` }),
              ]),
              el('td', {}, [
                el('span', { class: 'badge badge-hint', text: l.quality_hint ?? '-' }),
                el('div', { style: 'font-size:12px;color:var(--muted)', text: l.ai_confidence ? `신뢰도 ${Math.round(l.ai_confidence * 100)}%` : '' }),
              ]),
              el('td', { text: `${l.remaining_quantity} / ${l.quantity}` }),
              el('td', {}, [el('span', { class: 'badge badge-hub', text: inspectionLabel(l.inspection_status) })]),
              el('td', {}, [actions]),
            ]),
          );
        }
      }

      async function inspect(listingId, result, gradedQuality) {
        try {
          await api('/api/hub/inspections', { body: { listingId, result, gradedQuality } });
          toast(result === 'reject' ? '반려 처리했습니다.' : '검수 결과를 기록했습니다.');
          await load();
        } catch (err) {
          toast(err.message);
        }
      }

      async function downgrade(listingId) {
        const grade = prompt('실물 검수로 확정할 등급을 입력하세요 (특/상/보통)', '보통');
        if (!grade) return;
        try {
          await api('/api/hub/inspections', { body: { listingId, result: 'downgrade', gradedQuality: grade, note: '실물 검수 결과 등급 조정' } });
          toast('등급을 조정했습니다.');
          await load();
        } catch (err) {
          toast(err.message);
        }
      }

      async function setStatus(listingId, status) {
        try {
          await api(`/api/hub/listings/${listingId}/status`, { body: { status } });
          await load();
        } catch (err) {
          toast(err.message);
        }
      }

      await load();
    </script>
  </body>
</html>
