<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#00c46a" />
    <meta name="description" content="ON-FARM 장바구니 상품과 받는 분 정보를 확인하고 주문하세요." />
    <title>ON-FARM · 장바구니</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/img/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/shop.css" />
  </head>
  <body class="shop">
    <a class="skip-link" href="#mainContent">본문으로 바로가기</a>

    <div class="shop-page">
      <header class="shop-top">
        <a class="icon-button" href="/shop" aria-label="목록으로">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7" /></svg>
        </a>
        <span class="shop-top-title">장바구니</span>
        <div class="shop-top-actions">
          <span class="shop-top-title" id="who"></span>
        </div>
      </header>

      <main class="shop-main with-buybar" id="mainContent">
        <p class="notice" id="cartNotice" role="status" hidden></p>
        <div class="cart-list" id="items"></div>

        <form class="checkout" id="checkout" hidden>
          <h2>받는 분 정보</h2>
          <p class="notice plain" id="deliveryNotice" role="status" hidden></p>
          <label class="field"><span>이름</span><input id="rName" autocomplete="name" placeholder="받는 분 이름" required /></label>
          <label class="field"><span>연락처</span><input id="rPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="010-0000-0000" required /></label>
          <label class="field"><span>주소</span><input id="rAddress" autocomplete="street-address" placeholder="도로명과 상세 주소" required /></label>
          <label class="field"><span>요청사항 (선택)</span><input id="rMemo" /></label>
          <p class="notice plain">
            시연 환경입니다. 실제 결제·배송은 연동되지 않으며 주문은 결제 완료 상태로 기록됩니다.
          </p>
        </form>
      </main>

      <aside class="buybar" id="bar" aria-label="주문 합계" hidden>
        <div class="p"><b id="total">0원</b><span id="itemCount"></span></div>
        <button class="btn" id="orderBtn" type="submit" form="checkout">주문 접수하기</button>
      </aside>
    </div>

    <script type="module">
      import { $, api, el, money, me, toast } from '/js/api.js';
      import { clearCart, readCart, setQuantity, writeCart } from '/js/cart.js';
      import { mountCartBadges, photoImg } from '/js/shop-ui.js';

      mountCartBadges();

      const session = await me();
      $('#who').textContent = session?.user?.role === 'consumer' ? `${session.user.name}님` : '로그인 필요';

      // 최근 배송지 자동 입력 — 매번 다시 타이핑하지 않게 한다.
      if (session?.user?.role === 'consumer') {
        let delivery = null;
        try {
          ({ delivery } = await api('/api/store/delivery-profile'));
        } catch {
          /* 계정 정보만으로도 계속 입력할 수 있다. */
        }
        $('#rName').value ||= delivery?.receiver_name ?? session.user.name;
        $('#rPhone').value ||= delivery?.receiver_phone ?? session.user.phone ?? '';
        $('#rAddress').value ||= delivery?.address ?? '';
        if (delivery) {
          $('#deliveryNotice').textContent = '최근 주문의 배송 정보를 불러왔습니다. 필요하면 바꿔주세요.';
          $('#deliveryNotice').hidden = false;
        }
      }

      let renderVersion = 0;
      async function render() {
        const version = ++renderVersion;
        $('#bar').hidden = true;
        $('#checkout').hidden = true;
        const items = readCart();
        const box = $('#items');
        const notice = $('#cartNotice');
        box.replaceChildren();
        notice.hidden = true;

        // 담아둔 사이에 재고가 바뀔 수 있어 매번 서버에서 다시 확인한다.
        const available = [];
        const nextItems = [];
        let removed = 0;
        let reduced = 0;
        let unavailable = 0;
        for (const item of items) {
          try {
            const listing = (await api(`/api/store/listings/${item.listingId}`)).listing;
            if (listing.status !== 'active' || listing.remaining_quantity <= 0) {
              removed += 1;
              continue;
            }
            const quantity = Math.min(item.quantity, listing.remaining_quantity);
            if (quantity !== item.quantity) reduced += 1;
            nextItems.push({ listingId: item.listingId, quantity });
            available.push({ listing, quantity });
          } catch (error) {
            if (error.status === 404) {
              removed += 1;
            } else {
              nextItems.push(item);
              unavailable += 1;
            }
          }
        }

        if (version !== renderVersion) return;

        if (JSON.stringify(nextItems) !== JSON.stringify(items)) writeCart(nextItems);

        $('#itemCount').textContent = `${available.reduce((sum, item) => sum + item.quantity, 0)}개`;
        if (removed || reduced || unavailable) {
          notice.textContent = [
            removed ? `품절 상품 ${removed}개를 뺐습니다.` : '',
            reduced ? `재고에 맞춰 ${reduced}개 상품의 수량을 줄였습니다.` : '',
            unavailable ? `상품 ${unavailable}개의 재고를 확인하지 못했습니다. 잠시 후 다시 시도해주세요.` : '',
          ].filter(Boolean).join(' ');
          notice.hidden = false;
        }

        if (!available.length) {
          box.append(
            el('div', { class: 'empty' }, [
              el('h2', { text: unavailable ? '상품 정보를 확인하지 못했습니다.' : '장바구니가 비어 있습니다.' }),
              el('p', {
                text: unavailable
                  ? '담은 상품은 그대로 보관했습니다. 잠시 후 새로고침해주세요.'
                  : '오늘 올라온 농산물을 둘러보고 필요한 상품을 담아보세요.',
              }),
              unavailable ? null : el('a', { class: 'btn', href: '/shop', text: '상품 둘러보기' }),
            ]),
          );
          return;
        }

        let total = 0;
        for (const { listing, quantity } of available) {
          const amount = listing.unit_price * quantity;
          total += amount;
          const thumb = photoImg(listing);
          thumb.className = 'thumb';
          box.append(
            el('article', { class: 'cart-item' }, [
              thumb,
              el('div', { class: 'copy' }, [
                el('div', { class: 't', text: listing.title }),
                el('div', { class: 'm', text: `${listing.farm_name} · ${listing.sku_label} · 남은 재고 ${listing.remaining_quantity}개` }),
                el('div', { class: 'amount', text: money(amount) }),
              ]),
              el('div', { class: 'qty', 'aria-label': `${listing.title} 수량` }, [
                el('button', {
                  type: 'button',
                  'aria-label': `${listing.title} 수량 줄이기`,
                  text: '−',
                  onclick: () => { setQuantity(listing.id, quantity - 1); void render(); },
                }),
                el('span', { 'aria-live': 'polite', text: String(quantity) }),
                el('button', {
                  type: 'button',
                  'aria-label': `${listing.title} 수량 늘리기`,
                  text: '+',
                  disabled: quantity >= listing.remaining_quantity ? '' : null,
                  onclick: () => { setQuantity(listing.id, quantity + 1); void render(); },
                }),
              ]),
            ]),
          );
        }

        $('#total').textContent = money(total);
        $('#bar').hidden = unavailable > 0;
        $('#checkout').hidden = unavailable > 0;
      }

      await render();

      $('#checkout').addEventListener('submit', async (event) => {
        event.preventDefault();
        const current = await me();
        if (!current || current.user.role !== 'consumer') {
          location.href = '/login?role=consumer&next=/shop/cart';
          return;
        }

        const button = $('#orderBtn');
        button.disabled = true;
        button.textContent = '주문 접수 중';
        try {
          const response = await api('/api/store/orders', {
            body: {
              lines: readCart().map((item) => ({ listingId: item.listingId, quantity: item.quantity })),
              receiverName: $('#rName').value.trim(),
              receiverPhone: $('#rPhone').value.trim(),
              address: $('#rAddress').value.trim(),
              memo: $('#rMemo').value.trim(),
            },
          });
          clearCart();
          location.href = `/shop/orders?new=${encodeURIComponent(response.order.order_no)}`;
        } catch (error) {
          if (error.code === 'out_of_stock' || error.code === 'not_found') {
            await render();
            toast('재고 변동을 반영했습니다. 수량을 다시 확인해주세요.');
          } else {
            toast(error.message ?? '주문을 접수하지 못했습니다.');
          }
          button.disabled = false;
          button.textContent = '주문 접수하기';
        }
      });

      if (new URLSearchParams(location.search).get('checkout')) {
        $('#checkout')?.scrollIntoView({ behavior: 'smooth' });
      }
    </script>
  </body>
</html>
