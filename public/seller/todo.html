<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#00c46a" />
    <meta name="description" content="보낼 주문·판매 중 상품·받을 돈을 한 화면에서 보는 ON-FARM 판매자 오늘 할 일" />
    <title>ON-FARM · 오늘 할 일</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/img/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/seller.css" />
  </head>
  <body class="seller">
    <a class="skip-link" href="#mainContent">본문으로 바로가기</a>

    <main class="s-page" id="mainContent">
      <header class="s-head">
        <a class="s-chip" href="/seller">← 처음으로</a>
        <div class="s-head-actions">
          <button class="s-chip density-toggle" id="densityBtn" type="button">가⁻</button>
        </div>
      </header>

      <h1 class="ask">오늘 할 일</h1>

      <!-- ① 보낼 주문 (기존 farmer/orders.html) -->
      <section class="todo-section" aria-labelledby="ordersTitle">
        <h2 id="ordersTitle">보낼 주문</h2>
        <p class="sec-sub" id="orderSummary">주문을 불러오는 중입니다</p>
        <div id="orderList"></div>
        <p class="note-panel">포장과 배송은 거점이 돕습니다. 상품을 준비해 지역 거점에 가져다 놓으시면 됩니다.</p>
      </section>

      <!-- ② 판매 중 상품 (기존 farmer/listings.html) -->
      <section class="todo-section" aria-labelledby="listingsTitle">
        <h2 id="listingsTitle">판매 중 상품</h2>
        <p class="sec-sub" id="listSummary">상품을 불러오는 중입니다</p>
        <div id="listingList"></div>
        <a class="btn ghost" href="/seller/sell">사진으로 상품 더 올리기</a>
      </section>

      <!-- ③ 받을 돈 (기존 farmer/settlement.html) -->
      <section class="todo-section" aria-labelledby="moneyTitle">
        <h2 id="moneyTitle">받을 돈</h2>
        <div class="money-hero">
          <span>
            <span class="k">받으실 돈</span>
            <strong class="v" id="pending">-</strong>
            <span class="due" id="nextDue">지급 예정일 확인 중</span>
          </span>
          <button class="assist" id="speakMoney" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10H4Z" /><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" /></svg>
            읽어주기
          </button>
        </div>
        <div class="card">
          <dl class="kv-list">
            <div class="kv"><dt>정산 대상 판매 금액</dt><dd id="gross">-</dd></div>
            <div class="kv"><dt>수수료</dt><dd id="fee">-</dd></div>
            <div class="kv"><dt>이미 받은 돈</dt><dd id="paid">-</dd></div>
          </dl>
        </div>
        <div id="settlementRows"></div>
        <p class="note-panel" id="feeNote"></p>
      </section>
    </main>

    <script type="module">
      import {
        api, requireRole, money, dateTimeKst, el, $, imageOf,
        inspectionLabel, fulfillmentLabel, toast, startAutoRefresh,
      } from '/js/api.js';
      import { speak } from '/js/speak.js';
      import { speakPrice } from '/js/shared/korean.js';
      import { mountDensityToggle } from '/js/seller-density.js';

      mountDensityToggle('#densityBtn');
      await requireRole('farmer');

      /* ───────── ① 보낼 주문 ───────── */
      function hubGuide(order) {
        if (!order.hub_name || !order.hub_address) {
          return el('p', { class: 'hub-guide', text: '상품을 준비해 지역 거점에 가져다 놓아 주세요.' });
        }

        const copyButton = el('button', {
          class: 'mini-btn',
          type: 'button',
          text: '거점 주소 복사',
          'aria-label': `${order.hub_name} 주소 복사`,
          onclick: async () => {
            try {
              await navigator.clipboard.writeText(order.hub_address);
              toast('거점 주소를 복사했습니다.');
            } catch {
              toast('주소를 복사하지 못했습니다.');
            }
          },
        });

        const readyButton = order.fulfillment_status === 'farmer_preparing'
          ? el('button', {
              class: 'mini-btn primary',
              type: 'button',
              text: '준비 완료',
              'aria-label': `${order.title} 준비 완료 처리`,
              onclick: async (event) => {
                const button = event.currentTarget;
                button.disabled = true;
                button.textContent = '처리 중…';
                try {
                  await api(`/api/farmer/order-items/${order.id}/ready`, { body: {} });
                  toast('거점에 입고 대기로 전달했습니다.');
                  orderSignature = '';
                  await refreshOrders();
                } catch (error) {
                  toast(error.message);
                  button.disabled = false;
                  button.textContent = '준비 완료';
                }
              },
            })
          : null;

        return el('div', { class: 'hub-guide', 'aria-label': '전달할 거점' }, [
          el('strong', { text: `가져갈 곳 · ${order.hub_name}` }),
          el('address', { text: order.hub_address }),
          el('p', {
            text: order.fulfillment_status === 'farmer_preparing'
              ? '포장을 마친 뒤 준비 완료를 눌러주세요.'
              : '준비 완료했습니다. 거점의 입고 확인을 기다리고 있습니다.',
          }),
          el('div', { class: 'row-actions' }, [copyButton, readyButton]),
        ]);
      }

      let orderSignature = '';
      let previousPendingIds = null;

      async function loadOrders() {
        const { orders } = await api('/api/farmer/orders');
        const signature = JSON.stringify(
          orders.map((order) => [order.id, order.fulfillment_status, order.has_rejection, order.rejection_note]),
        );
        if (signature === orderSignature) return;

        const pendingOrders = orders.filter(
          (order) => order.fulfillment_status === 'farmer_preparing' && !order.has_rejection,
        );
        const rejectedOrders = orders.filter((order) => order.has_rejection);
        const pendingIds = new Set(pendingOrders.map((order) => order.id));
        // 새로 들어온 주문이 있을 때만 음성으로 알린다(같은 주문을 반복해서 읽지 않는다).
        const newPendingCount = previousPendingIds === null
          ? pendingIds.size
          : [...pendingIds].filter((id) => !previousPendingIds.has(id)).length;
        previousPendingIds = pendingIds;

        const box = $('#orderList');
        box.replaceChildren();

        const rejectedSummary = rejectedOrders.length ? ` 반려된 주문은 ${rejectedOrders.length}건입니다.` : '';
        if (pendingOrders.length > 0) {
          $('#orderSummary').textContent = `전체 ${orders.length}건 중 지금 준비할 주문이 ${pendingOrders.length}건 있습니다.${rejectedSummary}`;
          if (newPendingCount > 0) speak(`준비할 주문이 ${pendingOrders.length}건 있습니다.${rejectedSummary}`);
        } else if (rejectedOrders.length > 0) {
          $('#orderSummary').textContent = `전체 ${orders.length}건 중 반려된 주문이 ${rejectedOrders.length}건 있습니다.`;
        } else if (orders.length > 0) {
          $('#orderSummary').textContent = `전체 주문 ${orders.length}건이 모두 다음 단계로 넘어갔습니다.`;
        } else {
          $('#orderSummary').textContent = '아직 들어온 주문이 없습니다.';
        }

        if (!orders.length) {
          box.append(el('p', { class: 'empty', text: '주문이 들어오면 이 화면과 음성으로 알려드립니다.' }));
        }

        for (const order of orders) {
          const rejected = Boolean(order.has_rejection);
          const needsAttention = order.fulfillment_status === 'farmer_preparing' && !rejected;
          const statusLabel = rejected ? '검수 반려' : fulfillmentLabel(order.fulfillment_status);
          box.append(
            el('article', { class: `card${needsAttention ? ' attention' : ''}` }, [
              el('div', { class: 'card-head' }, [
                el('div', {}, [
                  el('p', { class: 'meta', text: `주문 ${order.order_no}` }),
                  el('h3', { text: order.title }),
                ]),
                el('span', {
                  class: rejected ? 'badge badge-danger' : needsAttention ? 'badge badge-hint' : 'badge badge-hub',
                  text: rejected ? '검수 반려' : needsAttention ? '준비 필요' : statusLabel,
                }),
              ]),
              el('p', { class: 'amount', text: money(order.amount) }),
              el('dl', { class: 'kv-list' }, [
                el('div', { class: 'kv' }, [
                  el('dt', { text: '준비할 수량' }),
                  el('dd', { text: `${order.quantity} × ${order.sku_label}` }),
                ]),
                el('div', { class: 'kv' }, [
                  el('dt', { text: '진행 상태' }),
                  el('dd', { text: statusLabel }),
                ]),
                rejected
                  ? el('div', { class: 'kv' }, [
                      el('dt', { text: '반려 사유' }),
                      el('dd', { text: order.rejection_note || '거점에 확인해주세요.' }),
                    ])
                  : null,
              ]),
              !rejected && (order.fulfillment_status === 'farmer_preparing' || order.fulfillment_status === 'ready_for_hub')
                ? hubGuide(order)
                : null,
            ]),
          );
        }
        orderSignature = signature;
      }

      /* ───────── ② 판매 중 상품 ───────── */
      async function manageListing(id, body, button) {
        button.disabled = true;
        try {
          await api(`/api/farmer/listings/${id}/manage`, { body });
          await loadListings();
        } catch (error) {
          button.disabled = false;
          toast(error instanceof Error ? error.message : '처리하지 못했습니다.');
        }
      }

      function listingActions(listing) {
        if (listing.inspection_status !== 'ai_checked' || listing.has_rejection) return null;

        const actions = [];
        const maxStock = 999 - listing.quantity;
        if (maxStock > 0) {
          const inputId = `stock-${listing.id}`;
          const input = el('input', {
            id: inputId,
            name: 'quantity',
            type: 'number',
            min: '1',
            max: String(maxStock),
            step: '1',
            inputmode: 'numeric',
            placeholder: '추가 수량',
            required: '',
          });
          const addButton = el('button', { class: 'mini-btn primary', type: 'submit', text: '재고 추가' });
          actions.push(
            el('form', {
              class: 'stock-form',
              onsubmit: (event) => {
                event.preventDefault();
                manageListing(listing.id, { action: 'add_stock', quantity: Number(input.value) }, addButton);
              },
            }, [
              el('label', { class: 'visually-hidden', for: inputId, text: `${listing.title} 추가 수량` }),
              input,
              addButton,
            ]),
          );
        }

        const toggleAction = listing.status === 'active'
          ? { action: 'pause', label: '판매 중지' }
          : listing.status === 'closed' && listing.remaining_quantity > 0
            ? { action: 'resume', label: '판매 재개' }
            : null;
        if (toggleAction) {
          const toggleButton = el('button', {
            class: `mini-btn${toggleAction.action === 'resume' ? ' primary' : ''}`,
            type: 'button',
            text: toggleAction.label,
            'aria-label': `${listing.title} ${toggleAction.label}`,
          });
          toggleButton.addEventListener('click', () => {
            manageListing(listing.id, { action: toggleAction.action }, toggleButton);
          });
          actions.push(toggleButton);
        }
        return actions.length ? el('div', { class: 'row-actions' }, actions) : null;
      }

      async function loadListings() {
        const { listings } = await api('/api/farmer/listings');
        const box = $('#listingList');
        box.replaceChildren();

        const activeCount = listings.filter((listing) => listing.status === 'active').length;
        $('#listSummary').textContent = listings.length
          ? `전체 ${listings.length}개 상품 중 ${activeCount}개를 판매하고 있습니다.`
          : '아직 올린 상품이 없습니다. 사진 한 장으로 첫 상품을 올려 보세요.';

        if (!listings.length) {
          box.append(el('p', { class: 'empty', text: '아래 버튼을 눌러 수확한 농산물을 올려 보세요.' }));
        }

        for (const listing of listings) {
          const sold = listing.quantity - listing.remaining_quantity;
          box.append(
            el('article', { class: 'card' }, [
              el('div', { class: 'card-head' }, [
                el('div', {}, [
                  el('h3', { text: listing.title }),
                  el('p', { class: 'meta', text: `${listing.sku_label} · ${money(listing.unit_price)}` }),
                ]),
                el('img', {
                  src: imageOf(listing),
                  alt: listing.title,
                  width: '56',
                  height: '56',
                  style: 'border-radius:12px;object-fit:cover',
                }),
              ]),
              el('p', { class: 'meta', text: `남은 수량 ${listing.remaining_quantity} · 판매 ${sold}` }),
              el('div', {
                class: 'stock-bar',
                role: 'img',
                'aria-label': `${listing.title} 판매 ${sold}개, 남은 수량 ${listing.remaining_quantity}개`,
              }, [
                el('i', { style: `width:${listing.quantity ? Math.round((sold / listing.quantity) * 100) : 0}%` }),
              ]),
              el('div', { class: 'badge-row' }, [
                el('span', {
                  class: listing.status === 'active' ? 'badge badge-ai' : 'badge badge-muted',
                  text: listing.status === 'active' ? '판매 중' : listing.status === 'sold_out' ? '완판' : '판매 종료',
                }),
                el('span', { class: 'badge badge-hub', text: inspectionLabel(listing.inspection_status) }),
              ]),
              listingActions(listing),
            ]),
          );
        }
      }

      /* ───────── ③ 받을 돈 ───────── */
      let pendingNet = 0;
      async function loadSettlements() {
        const data = await api('/api/farmer/settlements');
        const summary = data.summary;
        pendingNet = summary.pendingNet;

        $('#pending').textContent = money(summary.pendingNet);
        $('#gross').textContent = money(summary.totalGross);
        $('#fee').textContent = `− ${money(summary.totalFee)}`;
        $('#paid').textContent = money(summary.paidNet);
        $('#feeNote').textContent = `수수료 ${(data.feeRate * 100).toFixed(0)}%와 배송 완료 7일 후 지급 일정은 시연용 가정값입니다. 실제 기준은 운영 정책과 계약으로 정합니다.`;

        const nextDue = data.rows
          .filter((row) => row.status === 'pending' && !row.has_rejection && row.due_on)
          .map((row) => row.due_on)
          .sort()[0];
        $('#nextDue').textContent = nextDue
          ? `다음 지급 예정일 · ${nextDue}`
          : summary.processingNet > 0
            ? '배송 완료 후 지급 예정일이 정해집니다'
            : '현재 지급 예정 내역 없음';

        const box = $('#settlementRows');
        box.replaceChildren();
        if (!data.rows.length) {
          box.append(el('p', { class: 'empty', text: '상품이 판매되면 받을 금액이 이곳에 표시됩니다.' }));
        }

        for (const row of data.rows) {
          const excluded = row.status === 'pending' && row.has_rejection;
          box.append(
            el('article', { class: 'card' }, [
              el('div', { class: 'card-head' }, [
                el('div', {}, [
                  el('p', { class: 'meta', text: row.order_no }),
                  el('h3', { text: row.title }),
                ]),
                el('span', {
                  class: excluded ? 'badge badge-danger' : row.status === 'paid' ? 'badge badge-ai' : 'badge badge-hint',
                  text: excluded ? '정산 제외' : row.status === 'paid' ? '지급 완료' : row.due_on ? '지급 예정' : '배송 진행 중',
                }),
              ]),
              el('p', { class: 'meta', text: `${row.quantity}개 · 판매 ${money(row.gross)} − 수수료 ${money(row.fee)}` }),
              el('p', {
                class: 'meta',
                text: excluded
                  ? '반려로 정산 제외'
                  : row.status === 'paid'
                    ? `지급 기록 · ${row.paid_at ? dateTimeKst(row.paid_at) : '기존 기록(일시 없음)'}${row.payment_reference ? ` · ${row.payment_reference}` : ''}`
                    : row.due_on ? `${row.due_on} 지급 예정` : '배송 완료 후 지급 예정일 확정',
              }),
              el('p', { class: 'amount', text: excluded ? '지급 없음' : money(row.net) }),
            ]),
          );
        }
      }

      $('#speakMoney').addEventListener('click', () => {
        speak(`받으실 돈은 ${speakPrice(pendingNet)}입니다.`, { force: true });
      });

      // 주문은 새 주문 음성 알림 때문에 자동 갱신을 유지한다.
      const refreshOrders = startAutoRefresh(loadOrders);
      await Promise.all([refreshOrders(), loadListings(), loadSettlements()]);
    </script>
  </body>
</html>
